<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="t d">
  <title id="t">Nathan Moreno Galante — Desenvolvedor Full Stack</title>
  <desc id="d">Mobile, Web, Back-end e Inteligência Artificial. Janela de editor com o arquivo nathan.dart listando a stack: Flutter e Dart; Vue.js, React e TypeScript; Java, Spring Boot e Python; Kubernetes, Argo CD e GitHub Actions.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7AA2F7" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 60) scale(520 300)">
      <stop offset="0" stop-color="#7AA2F7" stop-opacity=".14"/>
      <stop offset="1" stop-color="#7AA2F7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1000" height="340" rx="14"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Liberation Mono', Menlo, monospace; white-space: pre; }
      .head { font-family: 'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .body { font-family: Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .c { fill: #565F89; font-style: italic; }
      .k { fill: #BB9AF7; }
      .ty { fill: #7DCFFF; }
      .s { fill: #9ECE6A; }
      .f { fill: #7AA2F7; }
      .p { fill: #C0CAF5; }
      .cur { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="340" fill="#0A0E17"/>
    <rect width="1000" height="340" fill="url(#grid)"/>
    <rect width="1000" height="340" fill="url(#glow)"/>
  </g>

  <!-- identidade -->
  <text x="40" y="110" class="mono" font-size="18"><tspan fill="#7AA2F7">&gt; </tspan><tspan class="p">whoami</tspan><tspan class="cur" fill="#7AA2F7">_</tspan></text>
  <text x="40" y="160" class="head" font-size="32" font-weight="700" fill="#E6EDF3">Nathan Moreno Galante</text>
  <text x="40" y="198" class="head" font-size="22" font-weight="600" fill="#7AA2F7">Desenvolvedor Full Stack</text>
  <text x="40" y="230" class="body" font-size="14" fill="#A9B1D6">Mobile · Web · Back-end · Inteligência Artificial</text>
  <rect x="40" y="252" width="56" height="3" rx="1.5" fill="#7AA2F7"/>

  <!-- editor -->
  <rect x="450" y="40" width="520" height="260" rx="10" fill="#111726" stroke="#1F2A44"/>
  <circle cx="470" cy="56" r="5" fill="#2A3350"/>
  <circle cx="487" cy="56" r="5" fill="#2A3350"/>
  <circle cx="504" cy="56" r="5" fill="#2A3350"/>
  <text x="526" y="60" class="mono" font-size="12" fill="#A9B1D6">nathan.dart</text>
  <path d="M450 72H970" stroke="#1F2A44"/>

  <g class="mono" font-size="12.5">
    <text x="468" y="100" class="c">// Londrina, PR · construindo apps desde 2021</text>
    <text x="468" y="121" xml:space="preserve"><tspan class="k">class</tspan><tspan class="p"> </tspan><tspan class="ty">Nathan</tspan><tspan class="p"> </tspan><tspan class="k">extends</tspan><tspan class="p"> </tspan><tspan class="ty">Developer</tspan><tspan class="p"> {</tspan></text>
    <text x="468" y="142" xml:space="preserve"><tspan class="p">  </tspan><tspan class="k">final</tspan><tspan class="p"> mobile  = [</tspan><tspan class="s">'Flutter'</tspan><tspan class="p">, </tspan><tspan class="s">'Dart'</tspan><tspan class="p">];</tspan></text>
    <text x="468" y="163" xml:space="preserve"><tspan class="p">  </tspan><tspan class="k">final</tspan><tspan class="p"> web     = [</tspan><tspan class="s">'Vue.js'</tspan><tspan class="p">, </tspan><tspan class="s">'React'</tspan><tspan class="p">, </tspan><tspan class="s">'TypeScript'</tspan><tspan class="p">];</tspan></text>
    <text x="468" y="184" xml:space="preserve"><tspan class="p">  </tspan><tspan class="k">final</tspan><tspan class="p"> backend = [</tspan><tspan class="s">'Java'</tspan><tspan class="p">, </tspan><tspan class="s">'Spring Boot'</tspan><tspan class="p">, </tspan><tspan class="s">'Python'</tspan><tspan class="p">];</tspan></text>
    <text x="468" y="205" xml:space="preserve"><tspan class="p">  </tspan><tspan class="k">final</tspan><tspan class="p"> infra   = [</tspan><tspan class="s">'Kubernetes'</tspan><tspan class="p">, </tspan><tspan class="s">'Argo CD'</tspan><tspan class="p">, </tspan><tspan class="s">'GitHub Actions'</tspan><tspan class="p">];</tspan></text>
    <text x="468" y="247" xml:space="preserve"><tspan class="p">  </tspan><tspan class="ty">Future</tspan><tspan class="p">&lt;</tspan><tspan class="ty">Solucao</tspan><tspan class="p">&gt; </tspan><tspan class="f">construir</tspan><tspan class="p">(</tspan><tspan class="ty">Problema</tspan><tspan class="p"> p) =&gt; ia.</tspan><tspan class="f">acelerar</tspan><tspan class="p">(p);</tspan></text>
    <text x="468" y="268" class="p">}</text>
  </g>
</svg>
